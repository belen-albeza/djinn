[package]
name = "djinn-dev-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.102"
djinnc = { path = "../djinnc" }
djinn-core = { path = "../djinn-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
tsify = { version = "0.5.6", features = ["js"] }
wasm-bindgen = "0.2.123"
console_error_panic_hook = "0.1.7"
